<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>diffalanche</title>
    <!-- The logo mark, drawn in the markup as the handoff asks: no raster file. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%231d2025'/%3E%3Crect%20x='6'%20y='6'%20width='9'%20height='9'%20rx='2.5'%20fill='%238b9ae0'/%3E%3Crect%20x='11'%20y='11'%20width='9'%20height='9'%20rx='2.5'%20fill='%23dfa85c'/%3E%3Crect%20x='16'%20y='16'%20width='9'%20height='9'%20rx='2.5'%20fill='%237ec49c'/%3E%3C/svg%3E"
    />
    <!--
      The theme before the first paint: the stylesheet must never apply the dark
      palette to a reader who chose the light one. The store reads the same key.
    -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("diffalanche.theme") === "light" ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
