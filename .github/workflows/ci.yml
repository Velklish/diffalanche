name: ci

on:
  push:
    branches: [main]
  pull_request:

# A superseded pull-request run is cancelled; a push to `main` gets a group per commit, since a
# shared group cancels queued runs too (docs/reference/11-perf.md, "Concurrency").
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

# Required checks are a branch protection rule matching check-run names, not job ids; the names
# to list are in docs/reference/11-perf.md, "The checks a pull request requires".
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:comments
      # The log says which runtime ran the suite, not only the assertion inside
      # it: Vitest runs the tests on Node here, and `test-bun` is the other half.
      - name: the runtime of this job
        run: node --version && node -e 'console.log(process.versions)'
      # The embedding tests read the pinned model from the user cache (09-ml.md). The key follows
      # the manifest; a cache GitHub has evicted means a fresh 135 MB from Hugging Face.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/diffalanche/models
          key: embedding-model-${{ hashFiles('src/core/ml/embed/model.ts') }}
      - run: bun run model:fetch
      - run: bun run test
      # Over the real tarball, and on a merge rather than on a tag
      # (11-perf.md). The two cheap halves of `build` are enough.
      - name: the npm tarball carries nothing unexpected
        run: |
          bun run build:cli
          bun run build:ui
          bun run check:package

  test-bun:
    name: unit suite on Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: the runtime of this job
        run: bun --version && bun -e 'console.log(process.versions)'
      # The embedding tests read the pinned model from the user cache (09-ml.md). The key follows
      # the manifest; a cache GitHub has evicted means a fresh 135 MB from Hugging Face.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/diffalanche/models
          key: embedding-model-${{ hashFiles('src/core/ml/embed/model.ts') }}
      - run: bun run model:fetch
      # The same Vitest suite as `check`, on Bun's own runtime instead of Node's.
      # `tests/runtime.test.ts` refuses the job if it is Node after all.
      - run: bun run test:bun

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run synth -- --out .perf/fixture
      - run: bun run perf

  ui:
    name: UI suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # Its own runner, because this suite and `e2e` share `dist/`; the two
      # macOS-only screenshots skip themselves here and say so (08-ui.md).
      - run: bun run test:ui

  smoke:
    name: smoke ${{ matrix.channel }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows is written, not verified: DA-45 runs it and makes it required, and until then a red
    # Windows job is something to read, not a blocked pull request.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The npm channel runs on Node; Bun is the toolchain that builds the
          # bundle and generates the fixture, so it is pinned with the others.
          - { channel: node, os: ubuntu-latest, bun: 1.3.14 }
          - { channel: node, os: macos-latest, bun: 1.3.14 }
          - { channel: node, os: windows-latest, bun: 1.3.14 }
          # Here Bun is what is under test, so the job takes the release of the
          # day: a Bun that breaks the tool shows up in this matrix.
          - { channel: bun, os: ubuntu-latest, bun: latest }
          - { channel: bun, os: macos-latest, bun: latest }
          - { channel: binary, os: ubuntu-latest, bun: 1.3.14 }
          - { channel: binary, os: macos-latest, bun: 1.3.14 }
    defaults:
      run:
        # Git Bash on the Windows runner: the smoke script is POSIX shell.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      # A binary carries the pinned model, and its build reads it from the user cache (09-ml.md);
      # the other channels download it on first use.
      - if: matrix.channel == 'binary'
        uses: actions/cache@v4
        with:
          path: ~/.cache/diffalanche/models
          key: embedding-model-${{ hashFiles('src/core/ml/embed/model.ts') }}
      - if: matrix.channel == 'binary'
        run: bun run model:fetch
      - name: build the channel
        run: |
          case "${{ matrix.channel }}" in
            node) bun run build:ui && bun run build:cli ;;
            bun) bun run build:ui ;;
            # One binary, not six: the job runs the one of its own runner.
            binary) bun run build -- --target current ;;
          esac
      - name: smoke
        run: |
          case "${{ matrix.channel }}" in
            node) command="node dist/cli.js" ;;
            bun) command="bun src/cli/index.ts" ;;
            binary)
              platform=$(node -p "process.platform === 'win32' ? 'windows' : process.platform")
              suffix=""
              [ "$platform" = windows ] && suffix=".exe"
              command="./dist/diffalanche-$platform-$(node -p process.arch)$suffix"
              ;;
          esac
          scripts/smoke.sh $command

  e2e:
    name: acceptance on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # The binary this suite builds carries the pinned model, read from the user cache (09-ml.md).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/diffalanche/models
          key: embedding-model-${{ hashFiles('src/core/ml/embed/model.ts') }}
      - run: bun run model:fetch
      # The suite's web server builds the binary and the fixture, so the job runs the one command a
      # developer runs and the build has no second place to drift (11-perf.md, "The CI jobs").
      - run: bun run test:e2e
      # One row per criterion of section 10, passed or failed: the list is worth having only when it
      # says which line of the acceptance list went red.
      - name: the criteria in the run summary
        if: always()
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "./e2e/test-results/acceptance.json";
            if (!fs.existsSync(path)) process.exit(0);
            const report = JSON.parse(fs.readFileSync(path, "utf8"));
            const rows = [];
            const walk = (suite) => {
              for (const spec of suite.specs ?? []) rows.push([spec.title, spec.ok]);
              for (const child of suite.suites ?? []) walk(child);
            };
            for (const suite of report.suites ?? []) walk(suite);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              "### Acceptance criteria of specification section 10",
              "",
              "| Criterion | |",
              "|---|---|",
              ...rows.map(([title, ok]) => `| ${title} | ${ok ? "ok" : "failed"} |`),
              "",
            ].join("\n"));
          '
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: acceptance-${{ matrix.os }}
          path: e2e/test-results/
