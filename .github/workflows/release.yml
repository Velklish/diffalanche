name: release

# One annotated tag, made by `scripts/release.ts` and pushed by the owner, is the whole trigger:
# nothing here tags or releases from a branch, and the tag's commit is what is published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # The GitHub release and the binaries attached to it.
      contents: write
      # The OIDC token npm signs the provenance attestation with.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes the .npmrc that `npm publish` reads NODE_AUTH_TOKEN from.
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: the version comes from the tag
        id: version
        # `package.json` is the second opinion: `scripts/release.ts` checks the pair before tagging,
        # and this catches a tag made by hand, which would publish under another version's name.
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $version, package.json says $declared"
            exit 1
          fi
          # A pre-release such as 0.1.0-rc.1 goes to `next` and is marked so on GitHub, so
          # `npx diffalanche` keeps pointing at the last stable version.
          case "$version" in
            *-*) dist_tag=next; prerelease=--prerelease ;;
            *) dist_tag=latest; prerelease= ;;
          esac
          {
            echo "version=$version"
            echo "dist_tag=$dist_tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME: npm dist-tag $dist_tag"

      - name: the release notes are this version's changelog section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Keep a Changelog gives a section per version, so the notes are read, not written; a
        # version with no section stops the release here, before anything is published.
        run: |
          set -eu
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          # Not `-s`: a section of blank lines is a file with a size and no
          # notes in it, and `scripts/release.ts` reads it the same way.
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $VERSION, or nothing under its heading"
            exit 1
          fi

      # The binaries carry the model, and the release carries it for the npm channel: both are
      # the pinned files, checked against the manifest's SHA-256 as they are fetched.
      - name: the embedding model
        run: bun run model:fetch

      # One runner cross-compiles all six binaries; they run in ci.yml's `smoke` matrix, not here
      # (docs/reference/11-perf.md, "The release").
      - name: build both channels
        run: bun run build

      # The model's files and every platform's native runtime files under their release names,
      # which the npm channel downloads by (09-ml.md, "Delivery"). Outside dist/, which npm packs.
      - name: the model and the runtime as release assets
        id: assets
        run: |
          set -eu
          count=$(bun run scripts/assets.ts "$RUNNER_TEMP/assets")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          ls -l "$RUNNER_TEMP/assets"

      - name: checksums
        # One line per binary and one per asset; `-c` re-reads each from its own directory.
        # The manifest stays out of `dist/`, which npm packs (11-perf.md).
        env:
          ASSETS: ${{ steps.assets.outputs.count }}
        run: |
          set -eu
          manifest="$RUNNER_TEMP/SHA256SUMS.txt"
          (cd dist && sha256sum diffalanche-*) > "$manifest"
          (cd "$RUNNER_TEMP/assets" && sha256sum -- *) >> "$manifest"
          lines=$(wc -l < "$manifest" | tr -d " ")
          expected=$((6 + ASSETS))
          if [ "$lines" -ne "$expected" ]; then
            echo "::error::SHA256SUMS.txt has $lines lines; six binaries and $ASSETS assets were expected"
            exit 1
          fi
          (cd dist && grep ' diffalanche-' "$manifest" | sha256sum -c -)
          (cd "$RUNNER_TEMP/assets" && grep -v ' diffalanche-' "$manifest" | sha256sum -c -)
          cat "$manifest"

      # GitHub first and npm last, which cannot be taken back: a re-run reuses this release, a draft
      # until its assets are on, and replaces them (docs/reference/11-perf.md, "The release").
      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -eu
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            $PRERELEASE
          gh release upload "$GITHUB_REF_NAME" \
            dist/diffalanche-* "$RUNNER_TEMP"/assets/* "$RUNNER_TEMP/SHA256SUMS.txt" \
            --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        # `--provenance` signs with this run's OIDC token; without `NPM_TOKEN` the step stops green
        # and the GitHub release is the whole release (docs/reference/11-perf.md, "The release").
        run: |
          set -eu
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN is not set; the npm publish is skipped, the GitHub release stands"
            exit 0
          fi
          npm publish --provenance --access public --tag "$DIST_TAG"
